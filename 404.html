<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重定向到Hexo博客</title>
    <script>
        // 如果当前路径是根路径，重定向到/hexo-file-demo/
        if (window.location.pathname === '/' || window.location.pathname === '/index.html') {
            // 首页不重定向
        } else if (!window.location.pathname.startsWith('/hexo-file-demo/')) {
            // 其他页面重定向
            window.location.href = '/hexo-file-demo' + window.location.pathname;
        }
    </script>
</head>
<body>
    <div style="text-align: center; padding: 50px;">
        <h1>正在重定向到文件资源博客...</h1>
        <p>如果页面没有自动跳转，请点击：</p>
        <a href="/hexo-file-demo/">访问文件资源博客</a>
    </div>
</body>
</html>
